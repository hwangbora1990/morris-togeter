<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORRIS</title>
    <link rel="stylesheet" href="../css/reset.css" />

    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="MORIS" />
    <meta property="og:title" content="MORIS의 이야기가 시작되는 곳" />
    <meta property="og:description" content="MORIS의 다양한 이야기를 만나보세요." />
    <meta property="og:url" content="https://hwangbora1990.github.io/morris-togeter/html/" />
    <meta property="og:image" content="./images/og/og.png" />
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href=""><img src="../images/common/logo.png" alt="" /></a>
      </h1>
      <nav class="gnb">
        <ul class="list">
          <li><a href="">상품소개</a></li>
          <li><a href="">회사소개</a></li>
          <li><a href="">연구개발</a></li>
          <li><a href="">홍보센터</a></li>
          <li><a href="">문의하기</a></li>
        </ul>
      </nav>
    </header>
    <!-- header end -->
    <div class="main-visual">
      <ul class="swiper-wrapper visual-list">
        <li class="swiper-slide visual01"><img src="../images/main/visual01.jpg" alt="" /></li>
        <li class="swiper-slide visual02"><img src="../images/main/visual02.jpg" alt="" /></li>
        <li class="swiper-slide visual03"><img src="../images/main/visual03.jpg" alt="" /></li>
        <li class="swiper-slide visual04"><img src="../images/main/visual04.jpg" alt="" /></li>
      </ul>
      <div class="pagination">
        <div></div>
      </div>
    </div>
    <aside class="popup">
      <div class="logo2"><img src="../images/common/logo2.svg" alt="" /></div>
      <div class="popup-menu">
        <a href="#">
          <span>온라인 스토어</span>
          <strong>바로가기</strong>
          <i>↗</i>
        </a>

        <div class="line"></div>

        <a href="#" class="inquiry">
          <span>대량 구매 문의</span>
          <i>↗</i>
        </a>
      </div>
    </aside>
  </body>
  <script>
    const customBullets = [
      `<div class="txt">
        <span class="no">01</span>
            <p class="title">Prime 글리터 형광펜 S</p>
            <p class="desc">
             안정적인 그립감의 JUSTCLICK Prime.<br />
             글리터 잉크와 손에 감기는 육각형 바디가 특징입니다.
            </p>
            <span class="btn">find out more</span>
      </div>
          <div class="line"></div>`,
      `<div class="txt">
      <span class="no">02</span>
          <p class="title">Prime 형광펜 S 앤티크</p>
          <p class="desc">
            안정적인 그립감의 JUSTCLICK Prime.<br />
            독보적인 컬러감의 잉크와 손에 감기는 육각형 바디가 특징입니다.
          </p>
          <span class="btn">find out more</span>
        </div>
          <div class="line"></div>`,
      `<div class="txt">
        <span class="no">03</span>
          <p class="title">Prime 형광펜 M 마일드</p>
          <p class="desc">
            안정적인 그립감의 JUSTCLICK Prime.<br />
            부드러운 마일드 컬러의 잉크와 손에 감기는 팔각형 바디가 특징입니다.
          </p>
          <span class="btn">find out more</span>
          </div>
          <div class="line"></div>`,
      `<div class="txt">
      <span class="no">04</span>
          <p class="title">사인펜 S 플러스</p>
          <p class="desc">
            한 번의 클릭으로 바로 사용 가능한 사인펜 s 플러스.<br />
            뚜껑 없는 수성 펜으로, 부드러운 필기감을 선사하는 얇은 팁이 특징입니다.
          </p>
          <span class="btn">find out more</span>
          </div>
          <div class="line"></div>`,
    ];
    const mainSwiper = new Swiper(".main-visual", {
      loop: true,
      // slidesPerView: 1,
      speed: 1000,
      // autoplay: { delay: 3000 },
      effect: "fade",
      // pagination: {
      //   el: ".main-visual .swiper-pagination",
      //   clickable: true,
      // },
      pagination: {
        el: ".main-visual .pagination",
        clickable: true,
        renderBullet: function (index, className) {
          return `<span class="${className}">${customBullets[index]}</span>`;
        },
      },
    });
  </script>
</html>
